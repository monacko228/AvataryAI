<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>AvataryAI</title>
<script>
  // /man=код  ->  версія для дослідження (app.html?man=код); усе інше -> головна
  var m = location.pathname.match(/man=([\w-]{1,20})/);
  location.replace(m ? "/app.html?man=" + m[1] : "/");
</script></head>
<body style="background:#0A0A0F;color:#F0F0FF;font-family:system-ui;padding:40px"><noscript><a href="/" style="color:#7B61FF">AvataryAI</a></noscript></body></html>
